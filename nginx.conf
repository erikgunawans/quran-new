server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nur routes entirely by URL hash (#/baca, #/surah/18, ...) — the hash never reaches the
    # server, so there is no SPA fallback to configure. Every request is a real file.
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types application/json text/css application/javascript;
}
