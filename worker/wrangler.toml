# New-Quranku edge Worker — proxy + generative endpoints.
#
# VERIFY BEFORE DEPLOY: `name` and `routes` must match the Worker already serving
# new-quranku.axiara.ai. Deploying with matching name+route UPDATES that live Worker. If unsure,
# see README.md → "Safe path" and copy just the /api handler into your existing Worker instead.

name = "new-quranku-proxy"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# The live front-door route (from the 2026-07-17 subdomain setup).
routes = [
  { pattern = "new-quranku.axiara.ai/*", zone_name = "axiara.ai" }
]

# Static assets — the app (web/dist) is served from Cloudflare's edge, NOT Cloud Run.
# web/dist is the exact same static bundle Cloud Run's nginx served. SPA fallback → index.html.
# REVERT to Cloud Run: delete this [assets] block, restore `return proxyToOrigin(...)` in index.ts.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Recitation — the full 6,236-ayah Alafasy corpus (~991 MB), keys `{surah}/{ayah}.mp3`, filled by
# `bun run src/app/ingest-audio-r2.ts`. Too large for git and far too large for the assets bundle,
# which is why it is a bucket and not `web/public/audio/`. The 22-file static sample stays in
# web/dist untouched and still answers if this binding is ever removed (see serveAudio in index.ts).
#
# DELIBERATELY TOP-LEVEL ONLY. wrangler env blocks do not inherit top-level bindings, so synthesis
# and demo do not get it — their /audio/* keeps serving the 22-file sample, unchanged.
# `wrangler deploy --env demo` therefore prints: «"r2_buckets" exists at the top level, but not on
# "env.demo" … Please add "r2_buckets" to "env.demo"». THAT WARNING IS THE INTENDED STATE, not a
# defect to fix. Adding the binding to those two envs would put a ~991 MB bucket behind two Workers
# that have no reason to serve recitation. Verified by `--dry-run`: synthesis lists no R2 binding.
#
# This edit is the ONE exception to ISA ISC-331 ("worker/wrangler.toml is untouched"), which was
# written to keep the DALIL surface — the Vectorize index and the okf-corpus bucket — off the
# trustworthy edition until the ustadz-gated flip. No such binding is added here; see ISC-379.
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "new-quranku-audio"

# ── THE DALIL SURFACE (ISC-434/435/449) — hadith retrieval for /api/answer ────────────────────────
#
# This is the binding change ISC-331 and ISC-379 were written to hold back, and it is landing because
# THE GATE THEY GUARDED IS CLEARED, not because it was worked around. Both anti-criteria protected one
# thing: the dalil surface must stay off the trustworthy edition until the ustadz-gated flip. There is
# no trustworthy edition at this scope any more — EDITION was set to "synthesis" here on 2026-08-12 at
# Erik's direct instruction — and Erik ruled on 2026-08-13 that Ustadz Ahmad's approval of the machine
# Indonesian extends from the Hadis tab to the answer card. So the literal wording of ISC-379 ("no
# VECTORIZE/CORPUS binding") is superseded; what it protected is not. See ISA ISC-450.
#
# WHY THIS OPENS THE WALL. `bad_hadith` refused 24% of ordinary questions (34 of 141, measured
# 2026-08-13) — one reader in four asking something perfectly normal got {answer:null}. The refusal
# was correct: with nothing retrieved and no marker syntax taught, the model could not produce a
# receipt for a prophetic attribution, so every one of them had to be stopped. These three bindings
# are what make a receipt POSSIBLE. The wall is unchanged; the door beside it now exists.
#
# TOP-LEVEL ONLY, exactly like AUDIO above and for the same mechanical reason: wrangler env blocks do
# not inherit top-level bindings. `--env synthesis` and `--env demo` therefore keep running WITHOUT
# the dalil surface and behave exactly as they do today — `handleAnswer` checks all three bindings
# together and simply retrieves no hadith when they are absent. `wrangler deploy --env demo` will
# print the same "exists at the top level, but not on env.demo" warning it already prints for
# r2_buckets. THAT WARNING IS THE INTENDED STATE.
#
# CORPUS_DIGEST namespaces the private text layer to one corpus revision — first 16 hex of the
# manifest's corpus_digest (docs/reference/okf-manifest.json). Change the corpus, change this, or the
# reranker reads a text layer that no longer matches the index.
[[vectorize]]
binding = "VECTORIZE"
index_name = "okf-hadith"

[[r2_buckets]]
binding = "CORPUS"
bucket_name = "okf-corpus"

# ── THE KAJIAN RUNNER SURFACE — WRITTEN, NOT BOUND (ISC-617) ──────────────────────────────────────
#
# COMMENTED OUT ON PURPOSE, and this is not an unfinished edit. Two of the three resources below do
# not exist in the account yet, and a `[[d1_databases]]` carrying a placeholder id would fail EVERY
# prod deploy until someone filled it in — including a deploy that had nothing to do with kajian.
# The code degrades correctly while these are absent, which is prod's state today:
#
#   DB unbound      → /api/admin/kajian/jobs 503s, /api/runner/* 503s, /kajian/index.json is not a
#                     route at all, so the feed sees the SPA fallback and renders its empty state.
#   KAJIAN unbound  → the upload route 503s and /kajian/{id}/{file} falls through to the SPA.
#   RUNNER_SECRET   → unset admits NOBODY. The runner surface answers 403 to everyone, always.
#
# ERIK'S DECISION (ISC-617): bind these in the SAME change that brings the runner up, so the app
# never carries a working admin page whose jobs nothing consumes. The runbook is
# `docs/runbooks/kajian-runner.md`; it is one sequence, in order, and it names what each step costs.
#
# ⚠️ ISC-630 IS NOT SETTLED. It gates what the runner may be pointed AT — whether a summary derived
# from Darussalam's material may publish — not whether any of this may be deployed. Deploying this
# publishes nothing by itself: the queue is empty and the runner is not running.
#
# ⚠️ THE DATABASE NOW EXISTS AND IS MIGRATED — created 2026-08-24 on Erik's instruction, region
# APAC, all four migrations applied to REMOTE and verified by reading `sqlite_master` and
# `pragma_table_info` rather than by trusting the ✅: tables `events`, `bookmarks`, `notes`,
# `reading_position`, `accounts`, `kajian_jobs`, and all nine of 0004's ALTER TABLE columns.
# The real id is recorded below so uncommenting is a one-step action with nothing to look up.
#
# ── `DB` IS BOUND; `KAJIAN` IS NOT. Erik chose this split on 2026-08-24. ─────────────────────────
#
# It is a DEPARTURE from the ISC-617 decision above ("bind these in the SAME change that brings the
# runner up"), made deliberately and with its cost known: the admin queue at `#/admin/kajian` now
# accepts jobs that NOTHING CAN DRAIN, because `/api/runner/*` still needs `RUNNER_SECRET` (unset →
# 403 to everyone) and `KAJIAN` (unbound → the upload route 503s). A queued job will sit `queued`
# indefinitely. That is the state ISC-617 wanted to avoid, and it is accepted here because the
# reason to bind is the OTHER surface: magic-link sign-in, which cannot work without `DB` at all —
# `handleAuthVerify` returns `{ok:false}` before it even reads the token.
#
# ⚠️ WHAT THIS BINDING DOES *NOT* SWITCH ON, AND WHAT DOES. Binding `DB` alone changes nothing a
# reader can observe. Every memory path — including `recordEvent(… "question" …)` at index.ts:671,
# which PERSISTS THE TEXT OF EVERY QUESTION ASKED — is gated on `identity.userId`, and
# `ensureIdentity` returns `{ userId: null }` whenever `IDENTITY_HMAC_SECRET` is unset. So the
# SECRET, not this binding, is the switch that starts storing readers' questions. Both are needed
# for sign-in, so setting it is not optional — but the consequence belongs next to the cause.
#
# The runner half stays commented and the bucket does not exist yet:
# [[r2_buckets]]
# binding = "KAJIAN"
# bucket_name = "new-quranku-kajian"          # does NOT exist yet

[[d1_databases]]
binding = "DB"
database_name = "new-quranku-memory"
database_id = "caa07809-f6d4-4d8e-92bb-98400f3e08de"
migrations_dir = "migrations"
#
# Secrets (never listed in this file):
#   wrangler secret put RUNNER_SECRET      # 32+ chars; under that length it admits nobody
#   wrangler secret put RESEND_API_KEY     # magic-link delivery, issue 07
#   wrangler secret put ADMIN_EMAILS       # unset means nobody holds the role — it fails closed
# And in [vars] below, once a domain is verified in Resend:
#   RESEND_FROM = "QuranKu <no-reply@axiara.ai>"

[vars]
# Retained for the (now-unused) proxy path, so reverting to Cloud Run is a one-line change.
ORIGIN_HOST = "nur-227613425590.asia-southeast2.run.app"
# Runtime model defaults (overridable). Non-secret.
OPENROUTER_MODEL = "deepseek/deepseek-v4-flash"
# First 16 hex of the manifest's corpus_digest — the same value wrangler.dalil-probe.toml uses, and
# it must stay the same value: the probe's whole purpose is to testify about live behaviour, which it
# cannot do if it reads a different revision of the text layer than prod does.
CORPUS_DIGEST = "8177e2e6e6c47370"
# AUTHORING IS ON (Erik, 2026-08-12, asked for directly and twice: "put it directly on the prod").
#
# This line was `principled`, and that word was the edition's whole identity: the app quoted sourced
# material verbatim and composed nothing. It is being deleted deliberately, not drifted past. The
# reason is a real one — asked "kenapa kita harus salat lima waktu", the app returned eight index
# captions and no explanation, and Erik's judgement was that he would not ship that to a user.
#
# WHAT THIS DOES NOT CHANGE. `handleAnswer` still runs every guard it always did: the answer is
# grounded ONLY in what retrieval returned, `fatwaShape` (answer-guard.ts:182) still rejects prose
# that issues a ruling, and the output is labelled AI-composed rather than attributed to a scholar.
# Warmth is unlocked; verdicts are not.
#
# WHAT IT DOES NOT FIX. Synthesis composes over whatever retrieval hands it — it dresses retrieval,
# it does not correct it. Where the wrong ayah comes back (the known `nikah beda agama` -> QS 4:25
# case) the answer is now fluent AND wrong, which is harder for a reader to discount than a visibly
# cold list. That is tracked as the next job, not as a reason to hold this.
#
# STILL OPEN: Ustadz Ahmad has had a heads-up on AI-authored answers, not a sign-off.
# REVERT: set this back to "principled" and rebuild the front end WITHOUT VITE_ANSWER_MODE.
# Both halves are required — the flag alone leaves a front end that still calls /api/answer.
EDITION = "synthesis"
# SEALION_BASE_URL = "https://api.sea-lion.ai/v1/chat/completions"
# SEALION_MODEL = "aisingapore/Gemma-SEA-LION-v3-9B-IT"

# SECRETS ARE NOT LISTED HERE — they are set out-of-band and encrypted at rest:
#   wrangler secret put OPENROUTER_API_KEY
#   wrangler secret put SEALION_API_KEY      # optional, only if you use the SEA-LION path

# ── env: synthesis — RETIRED 2026-08-19, DELETED, DO NOT RECREATE ─────────────────────────────────
#
# `new-quranku-ai.axiara.ai` — the AI-authoring alternative that ran side by side with the principled
# app from 2026-07-19 so Erik could compare them. The Worker `new-quranku-ai-proxy` was deleted on
# 2026-08-19 (`wrangler delete --env synthesis`) and its `[env.synthesis]` blocks were removed here in
# the same commit. The DNS AAAA `new-quranku-ai` → 100:: was deleted from the axiara.ai zone too, so
# the hostname does not resolve. Its OPENROUTER_API_KEY died with the Worker.
#
# WHY IT WAS DELETED, because "it was redundant" is the wrong lesson. It had not been redeployed since
# before ISC-418, and ISC-418 is the criterion that stops the model authoring from NOTHING. Measured
# 2026-08-19 with paired arms, identical POST, `{"verses":[],"entries":[]}`:
#
#     new-quranku    (prod, current)      → {"answer":null} in 0.1 s   — the bail fires
#     new-quranku-ai (never redeployed)   → 1,757-char authored Islamic answer in 17.4 s
#
# Same for grounding that fails the digest hash. So a public surface was still composing religious
# answers out of parametric memory, months after Erik ruled on 2026-08-13 that it must not — because
# **an environment that is never deployed is a time capsule of every defect fixed since**. The fix
# was in the codebase and on main the whole time, and neither of those ships anything.
#
# THE COMPARISON THIS SERVED IS OVER: prod itself has run EDITION = "synthesis" since 2026-08-12 (see
# the top-level [vars] above), so the two editions are no longer two.
#
# If a second edition is ever wanted again, write it fresh rather than restoring this block — and give
# it a deploy that runs whenever prod's does, or it will rot the same way. Do not simply re-add
# `[env.synthesis]`: that resurrects the surface WITHOUT its secret and without the ISC-418 fix
# unless the front end is rebuilt with VITE_ANSWER_MODE=synthesis first.

# ── env: demo — the QuranKu-clone showcase (demo-quranku.axiara.ai) ────────────────────────────────
#
# The SURVIVING app as of 2026-07-22. Serves the ISOLATED demo bundle (web/dist-demo, built by
# `bun run demo:build`) instead of web/dist.
#
# It used to be a static host only, borrowing the synthesis Worker's key cross-origin at
# https://new-quranku-ai.axiara.ai/api/*. Retiring the other two apps would have left the surviving
# one depending on a deleted one, so this Worker now holds its OWN key and serves its own /api/*.
# Same-origin, so there is no CORS surface here at all.
#
# EDITION is `synthesis` because the demo IS the AI-authoring edition — /api/answer must be live
# here or Tanya degrades to keyword retrieval and canned openers.
#
# DEPLOY:  bun run demo:build && cd worker && bunx wrangler deploy --env demo
# SECRET (once): cd worker && bunx wrangler secret put OPENROUTER_API_KEY --env demo
# DNS (once): add a PROXIED placeholder AAAA `demo-quranku` → 100:: on the axiara.ai zone (same trick as
#   new-quranku / new-quranku-ai); the route below then binds the Worker to the hostname.
# CORS (once): add https://demo-quranku.axiara.ai to ALLOWED_ORIGINS in src/index.ts and redeploy the
#   synthesis Worker (--env synthesis), or the demo's Tanya is CORS-blocked.
[env.demo]
name = "new-quranku-demo-proxy"
routes = [
  { pattern = "demo-quranku.axiara.ai/*", zone_name = "axiara.ai" }
]

[env.demo.assets]
directory = "../web/dist-demo"
binding = "ASSETS"
not_found_handling = "single-page-application"

[env.demo.vars]
ORIGIN_HOST = "nur-227613425590.asia-southeast2.run.app"
OPENROUTER_MODEL = "deepseek/deepseek-v4-flash"
EDITION = "synthesis"
# Magic-link From (issue 07). Resend TEST mode: `onboarding@resend.dev` delivers only to the Resend
# account owner's own email — enough to verify the flow. For production (email ANY user), verify a
# domain on axiara.ai in Resend and change this to e.g. "QuranKu <no-reply@axiara.ai>".
RESEND_FROM = "QuranKu <onboarding@resend.dev>"

# Personalized-memory raw truth layer (issue 02 / T2). Demo-only. Apply the schema with:
#   cd worker && bunx wrangler d1 execute new-quranku-demo-memory --env demo --remote --file migrations/0001_init.sql
[[env.demo.d1_databases]]
binding = "DB"
database_name = "new-quranku-demo-memory"
database_id = "5c522383-6614-4353-91e3-32fba36de5c0"

# Derived profile (issue 04 / T4). The regenerable distillation of the raw D1 log — interest tags +
# a 2-line summary, one small blob per user, read fast on every request.
[[env.demo.kv_namespaces]]
binding = "PROFILE_KV"
id = "7a6791bf601a44d88af64e2ae6de9ec3"

# Magic-link login (issue 07 / T6). DORMANT until Resend is set up:
#   1. Create a Resend account, verify a sending domain on axiara.ai (DNS records).
#   2. cd worker && bunx wrangler secret put RESEND_API_KEY --env demo   (paste the Resend API key)
#   3. Add the From address below (must be on the verified domain), then redeploy --env demo.
# Until then, /api/auth/request returns { sent: false } and the login UI says "belum aktif".
# [env.demo.vars] RESEND_FROM is added there once the domain is verified, e.g.:
#   RESEND_FROM = "QuranKu <no-reply@axiara.ai>"
