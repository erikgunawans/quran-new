<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1a16" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f9f6" media="(prefers-color-scheme: light)">
<meta name="description" content="New-Quranku — Al-Qur'an dengan terjemah makna yang bisa kamu pahami. Setiap sumber disebutkan namanya.">
<title>New-Quranku</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Arabic is the hero: Amiri renders Uthmani diacritics correctly. Fraunces speaks only where
     the app addresses the reader; Plus Jakarta Sans carries everything else. Variable ranges
     (400..800), never a list of static cuts — measured bandwidth, not assumed. -->
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,400..500;1,9..144,400..500&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
</head>
<body>

<!-- The two-layer shell (from claude.ai/design "QuranKu AI Chat"): a collapsible sidebar on the
     outer layer, a celestial inner panel that owns the reading width. data-nav toggles the sidebar.
     Every engine hook (#chat/#thread/#hello/#band/#read/#composer/#q/#send, nav-*, display-*) is
     preserved so main.ts and its modules bind unchanged. -->
<div class="qk-shell" id="shell" data-nav="open">

  <aside class="qk-sidebar" id="sidebar">
    <div class="qk-side-head">
      <a class="qk-brand" href="#/" aria-label="QuranKu — beranda">
        <!-- The Al-Qur'an mark Erik supplied 2026-08-09. New filename on purpose: `quranku2.1.png`
             was a truncated PNG that rendered "cut" for weeks, so a mark is never re-pointed at an
             older file here — it is replaced by a new one that has been checked end-to-end. -->
        <img src="/quranku-mark.png" alt="" width="46" height="46" />
        <span class="qk-hero-gradient qk-display">QuranKu</span>
      </a>
      <button class="qk-iconbtn" id="side-toggle" type="button" aria-label="Sembunyikan sidebar" title="Sembunyikan sidebar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M10 4v16"></path></svg>
      </button>
    </div>

    <button class="qk-newchat" id="newchat" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--action)" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>
      Obrolan baru
      <span class="kbd">⌘K</span>
    </button>

    <nav class="qk-nav" aria-label="Utama">
      <a href="#/" id="nav-tanya" aria-label="Tanya">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5"/><path d="M6 10.5V19h12v-8.5"/></svg>
        <span>Tanya</span>
      </a>
      <a href="#/baca" id="nav-baca" aria-label="Al Qur'an">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.6C10.4 5.4 8.4 5.1 6 5.3v12.5c2.4-.2 4.4.1 6 1.3 1.6-1.2 3.6-1.5 6-1.3V5.3c-2.4-.2-4.4.1-6 1.3Z"/><path d="M12 6.6v12.5"/></svg>
        <span>Al Qur'an</span>
      </a>
      <a href="#/hadis" id="nav-hadis" aria-label="Hadis">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v14H6.5A2.5 2.5 0 0 0 4 19.5Z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H19v4H6.5A2.5 2.5 0 0 1 4 19.5Z"/><path d="M8 7.5h7M8 10.5h5"/></svg>
        <span>Hadis</span>
      </a>
      <a href="#/fikih" id="nav-fikih" aria-label="Fikih">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M7 21h10M5 6h14l-3 5H8Z"/><path d="M5 6 3 11a3 3 0 0 0 6 0L7 6M19 6l-2 5a3 3 0 0 0 6 0l-2-5"/></svg>
        <span>Fikih</span>
      </a>
      <a href="#/peta" id="nav-peta" aria-label="Tematik">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20v-6M12 20V8M18 20v-9"/></svg>
        <span>Tematik</span>
      </a>
    </nav>

    <!-- The two utilities Erik pulled off the landing: "Ayat untukmu" + the prayer schedule now
         live here as click-to-reveal disclosures (closed by default). band.ts still binds
         #band/#aod/#prayer by id and paints them here, wherever they sit in the DOM. -->
    <div class="qk-tools" aria-label="Alat">
      <details class="qk-tool" id="tool-aod">
        <summary class="qk-tool-sum">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.4 5.6 6.1.5-4.6 4 1.4 5.9L12 15.9 6.7 19l1.4-5.9-4.6-4 6.1-.5z"/></svg>
          <span>Ayat untukmu</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </summary>
        <div class="qk-tool-body">
          <div class="band" id="band" hidden>
            <section class="aod" id="aod" aria-labelledby="aod-label"></section>
          </div>
        </div>
      </details>
      <details class="qk-tool" id="tool-prayer">
        <summary class="qk-tool-sum">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>Waktu salat</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </summary>
        <div class="qk-tool-body">
          <aside class="prayer" id="prayer" aria-label="Waktu salat"></aside>
        </div>
      </details>
    </div>

    <span class="qk-riwayat">Riwayat</span>
    <div class="qk-history" id="history"></div>

    <div class="qk-user"><span class="avatar" aria-hidden="true"></span><span>Masuk</span></div>
  </aside>

  <div class="qk-panel" id="panel">
    <div class="qk-panel-top">
      <button class="qk-iconbtn" id="panel-toggle" type="button" aria-label="Tampilkan sidebar" title="Tampilkan sidebar">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M10 4v16"></path></svg>
      </button>
      <span class="spacer"></span>

      <!-- Kembali lives here on the Al-Qur'an surface (Erik: beside the info icon), shown only on
           #/baca via [data-baca] in shell.css. It leaves the browse index back to the companion home. -->
      <a class="top-back" id="top-back" href="#/">
        <span aria-hidden="true">←</span> Kembali
      </a>

      <!-- The one explainer: "why two translations", contextual on verse cards + here. -->
      <button class="icon-btn" id="info" data-explain="open" aria-label="Kenapa ada dua terjemahan?" title="Kenapa ada dua terjemahan?">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="8" r="0.75" fill="currentColor" stroke="none"/></svg>
      </button>

      <!-- theme + Arabic size -->
      <div class="display-pop" id="display-pop">
        <button class="icon-btn display-trigger" id="display-trigger" aria-haspopup="true" aria-expanded="false" aria-controls="display-panel" aria-label="Tampilan: mode dan ukuran teks" title="Tampilan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h11M4 12h16M4 18h7"/><circle cx="18" cy="6" r="2"/><circle cx="9" cy="18" r="2"/></svg>
        </button>
        <div class="pop" id="display-panel" role="dialog" aria-label="Tampilan" hidden>
          <div class="pop-row">
            <span>Mode</span>
            <button class="icon-btn" id="theme" aria-label="Ganti mode terang/gelap" title="Ganti mode">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
            </button>
          </div>
          <div class="pop-row">
            <span>Ukuran Arab</span>
            <div class="size" id="size" role="group" aria-label="Ukuran teks Arab">
              <button data-size="s" aria-pressed="false" title="Teks Arab kecil">A</button>
              <button data-size="m" aria-pressed="true"  title="Teks Arab sedang" style="font-size:1rem">A</button>
              <button data-size="l" aria-pressed="false" title="Teks Arab besar" style="font-size:1.2rem">A</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="qk-panel-body">
      <div class="app" id="app">
        <!-- Corpus failed to load. Reading still works — the surah index is inlined, not fetched. -->
        <div class="boot-error" id="boot-error" role="alert" hidden></div>

        <section id="chat">
          <main class="thread" id="thread">
            <section class="hello" id="hello">
              <!-- The hero: Arabic greeting first (the salam a Muslim already knows), then the app
                   addresses the reader. greet.ts writes the time-aware latin line into #greet-la. -->
              <div class="greet-ar qk-hero-salam" dir="rtl" lang="ar">ٱلسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ ٱللَّهِ وَبَرَكَاتُهُ</div>
              <p class="greet-la" id="greet-la"></p>
              <h1 class="qk-hero-gradient">Tanya Apapun</h1>
              <p>Tulis apa yang sedang kamu rasakan. QuranKu mencarikan ayat, terjemahan, dan tafsirnya — lengkap dengan sumbernya.</p>

              <!-- The composer docks here on landing. With .seeds removed, dockLanding() falls to
                   hero.append(bar), so the composer seats right under the invitation — a clean
                   hero: greeting, headline, invitation, composer, nothing below. -->
            </section>
          </main>
        </section>

        <!-- The reading surface. You cannot have a Qur'an app you cannot read the Qur'an in. -->
        <section id="read" hidden></section>

        <p class="sr" id="live" role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>
</div>

<!-- The composer is a body-level sibling so landing.ts can move it between the hero (landing) and
     the docked bottom bar (conversation). shell.css positions each state, offset by the sidebar. -->
<div class="composer" id="composer-bar">
  <form id="composer">
    <label class="sr" for="q">Ceritakan apa yang kamu rasakan</label>
    <textarea id="q" rows="1" placeholder="Ceritakan atau tanyakan apa saja…" autocomplete="off"></textarea>
    <!-- Dictation. Speech-to-text is the direction Erik is heading; this is the affordance, wired to
         the browser's own recogniser where it exists so it is never a dead control. dictate.ts owns
         the behaviour and hides the button outright on engines that cannot do it. -->
    <!-- One action cluster, because the landing composer is a COLUMN — two loose buttons would stack
         vertically there instead of sitting side by side at the bottom-right. -->
    <div class="composer-actions">
      <button class="mic" id="mic" type="button" hidden aria-label="Rekam suara" title="Rekam suara" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
      </button>
      <button class="send" id="send" type="submit" disabled aria-label="Kirim">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </form>
</div>

<!-- Back-to-top: appears after a screen of scroll. main.ts (initToTop) unhides + wires it. -->
<button class="to-top" id="to-top" type="button" hidden aria-label="Kembali ke atas" title="Kembali ke atas">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V6M5 12l7-7 7 7"/></svg>
</button>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
