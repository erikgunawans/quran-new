<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1a16" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f9f6" media="(prefers-color-scheme: light)">
<meta name="description" content="New-Quranku — Al-Qur'an dengan terjemah makna yang bisa kamu pahami. Setiap sumber disebutkan namanya.">
<title>New-Quranku</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Arabic is the hero: Amiri renders Uthmani diacritics correctly. Fraunces speaks only where
     the app addresses the reader; Plus Jakarta Sans carries everything else.

     Weights are requested as VARIABLE RANGES (400..800), never as a list of static cuts. The
     reader's bandwidth is a moral constraint, and this is where that gets decided: asking for
     `wght@400;500;600;700;800` ships five separate files per subset — 548 KB for an Indonesian
     reader (latin+arabic). The same weights as one variable range cost 414 KB. Measured, not
     assumed. Adding a weight to this list is never free; adding it inside the range is. -->
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,400..500;1,9..144,400..500&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <a class="mark" href="#/" aria-label="New-Quranku — beranda">
      <span class="emblem" aria-hidden="true">ق</span>
      <span class="latin">New-Quranku</span>
    </a>

    <nav class="nav" aria-label="Utama">
      <a class="nav-link" href="#/" id="nav-tanya">Tanya</a>
      <a class="nav-link" href="#/baca" id="nav-baca">Baca</a>
      <a class="nav-link" href="#/tema" id="nav-tema">Tema</a>
      <a class="nav-link" href="#/peta" id="nav-peta">Peta</a>
    </nav>

    <!-- Persistent access to the SAME explainer #hello nudges toward once — explain.ts's
         openExplainer() dialog, not a separate popover, so there's one explainer, not two. -->
    <button class="icon-btn" id="info" data-explain="open" aria-label="Kenapa ada dua terjemahan?" title="Kenapa ada dua terjemahan?">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="8" r="0.75" fill="currentColor" stroke="none"/>
      </svg>
    </button>

    <!-- theme + Arabic size: inline controls on tablet/desktop; on phones they collapse behind
         one trigger (below the tablet breakpoint in styles.css) so the header row doesn't carry
         nine 44px targets across a thumb's reach. Same elements either way — CSS repositions
         the panel, nothing is duplicated. -->
    <div class="display-pop" id="display-pop">
      <button class="icon-btn display-trigger" id="display-trigger" aria-haspopup="true" aria-expanded="false" aria-controls="display-panel" aria-label="Tampilan: mode dan ukuran teks" title="Tampilan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h11M4 12h16M4 18h7"/><circle cx="18" cy="6" r="2"/><circle cx="9" cy="18" r="2"/>
        </svg>
      </button>
      <div class="pop" id="display-panel" role="dialog" aria-label="Tampilan" hidden>
        <div class="pop-row">
          <span>Mode</span>
          <button class="icon-btn" id="theme" aria-label="Ganti mode terang/gelap" title="Ganti mode">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
            </svg>
          </button>
        </div>
        <div class="pop-row">
          <span>Ukuran Arab</span>
          <div class="size" id="size" role="group" aria-label="Ukuran teks Arab">
            <button data-size="s" aria-pressed="false" title="Teks Arab kecil">A</button>
            <button data-size="m" aria-pressed="true"  title="Teks Arab sedang" style="font-size:1rem">A</button>
            <button data-size="l" aria-pressed="false" title="Teks Arab besar" style="font-size:1.2rem">A</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Corpus failed to load. Reading still works — the surah index is inlined, not fetched. -->
  <div class="boot-error" id="boot-error" role="alert" hidden></div>

  <section id="chat">
    <main class="thread" id="thread">
      <section class="hello" id="hello">
        <!-- The app notices what time it is for you. Arabic first — it is the greeting a
             Muslim already knows, not decoration. The Latin line is written by greet.ts. -->
        <div class="greet">
          <div class="greet-ar" dir="rtl" lang="ar">ٱلسَّلَامُ عَلَيْكُمْ</div>
          <p class="greet-la" id="greet-la"></p>
        </div>
        <h1>Ada apa <em>hari ini?</em></h1>
        <p>Cerita saja pakai bahasa kamu sendiri. Aku carikan ayatnya — lalu kamu lihat sendiri siapa yang mengatakan apa.</p>
        <!-- Four diverse feelings, not six. The point is to show "type how you feel", not to
             enumerate every state. A calmer first screen for a reader who may be in distress. -->
        <div class="seeds">
          <button class="seed">aku lagi capek banget</button>
          <button class="seed">lagi banyak utang, stress</button>
          <button class="seed">baru kehilangan orang tua</button>
          <button class="seed">cemas terus tiap malam</button>
        </div>
        <p class="hint">Atau sebutkan langsung surah dan ayatnya — <b>18:10</b>, <b>yasin</b>, <b>2:255</b>.</p>

        <!-- The "why two translations" explainer is NOT parked here on the empty landing anymore.
             It lives where the confusion actually happens: inline on every verse card's translation
             label (data-explain="open", see verse.ts) and on the header #info button. Contextual, not
             upfront clutter. -->
      </section>

      <!-- The band: scripture owns the width, prayer is a utility sidebar. The asymmetry is
           the point — a 50/50 split would say the two carry equal weight. Both are painted
           by JS (band.ts) because both depend on the corpus and on the reader's clock. -->
      <div class="band" id="band" hidden>
        <section class="aod" id="aod" aria-labelledby="aod-label"></section>
        <aside class="prayer" id="prayer" aria-label="Waktu salat"></aside>
      </div>
    </main>
  </section>

  <!-- The reading surface. You cannot have a Qur'an app you cannot read the Qur'an in. -->
  <section id="read" hidden></section>

  <p class="sr" id="live" role="status" aria-live="polite"></p>
</div>

<div class="composer" id="composer-bar">
  <form id="composer">
    <label class="sr" for="q">Ceritakan apa yang kamu rasakan</label>
    <textarea id="q" rows="1" placeholder="Ceritakan apa yang kamu rasakan…" autocomplete="off"></textarea>
    <button class="send" id="send" type="submit" disabled aria-label="Kirim">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    </button>
  </form>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
