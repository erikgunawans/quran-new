<title>Peta Tematik Al-Qur'an — 3D</title>
<style>
  :root{
    --bg:#0d1310; --bg2:#070b09; --panel:#131c18; --panel-2:#1b2621;
    --line:#26332c; --line-2:#33463c;
    --ink:#f6f4ec; --ink-2:#b7c3ba; --ink-3:#7f8f84;
    --bridge:#ffffff;
    --shadow:0 10px 40px rgba(0,0,0,.6);
    --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#e9ede8; --bg2:#dbe2d9; --panel:#ffffff; --panel-2:#f3f6f1;
    --line:#d5ddd4; --line-2:#c0cbbe; --ink:#141a16; --ink-2:#3f4b43; --ink-3:#67766c;
    --bridge:#101a14; --shadow:0 10px 40px rgba(30,45,38,.14);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(130% 130% at 50% 38%,var(--bg) 0%,var(--bg2) 100%);color:var(--ink);font-family:var(--f);overflow:hidden;-webkit-font-smoothing:antialiased}
  canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas.grabbing{cursor:grabbing}
  .float{position:fixed;z-index:5;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(9px)}

  #head{top:18px;left:18px;padding:15px 18px 14px;max-width:min(340px,calc(100vw - 36px))}
  #head h1{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
  #head .sub{margin-top:3px;font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
  #head .stats{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:11px;font-size:11px;color:var(--ink-2)}
  #head .stats b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}

  #searchWrap{top:18px;right:18px;padding:0}
  #search{width:210px;max-width:calc(100vw - 36px);background:transparent;border:0;outline:0;color:var(--ink);font:inherit;font-size:13px;padding:11px 14px}
  #search::placeholder{color:var(--ink-3)}
  #searchWrap.hit{border-color:var(--line-2)}

  #legend{left:18px;bottom:18px;padding:12px 12px 11px;width:250px;max-width:calc(100vw - 36px);max-height:min(48vh,440px);display:flex;flex-direction:column}
  #legend .lh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:0 2px}
  #legend .lh span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  #legend .reset{font-size:11px;color:var(--ink-2);background:none;border:0;cursor:pointer;padding:2px 4px;border-radius:6px}
  #legend .reset:hover{color:var(--ink);text-decoration:underline}
  #cats{overflow-y:auto;display:flex;flex-direction:column;gap:1px;margin:-2px}
  .cat{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .cat:hover{background:var(--panel-2)}
  .cat.off{opacity:.34}.cat.solo{background:var(--panel-2);border-color:var(--line-2)}
  .cat .dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
  .cat .nm{font-size:12px;line-height:1.25;flex:1;min-width:0}
  .cat .ct{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
  #legend .foot{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
  .toggle{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2);cursor:pointer;user-select:none}
  .toggle .sw{width:30px;height:17px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line-2);position:relative;flex:none;transition:background .15s}
  .toggle .sw::after{content:"";position:absolute;top:1.5px;left:1.5px;width:12px;height:12px;border-radius:50%;background:var(--ink-3);transition:transform .15s,background .15s}
  .toggle.on .sw{background:color-mix(in srgb,var(--bridge) 22%,transparent);border-color:color-mix(in srgb,var(--bridge) 45%,transparent)}
  .toggle.on .sw::after{transform:translateX(13px);background:var(--bridge)}

  #detail{top:18px;right:18px;width:290px;max-width:calc(100vw - 36px);padding:0;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .16s,transform .16s;max-height:calc(100vh - 36px);display:flex;flex-direction:column}
  #detail.show{opacity:1;transform:none;pointer-events:auto}
  #detail .dh{padding:15px 16px 13px;border-bottom:1px solid var(--line)}
  #detail .ref{font-size:20px;font-weight:680;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  #detail .surah{font-size:12.5px;color:var(--ink-2);margin-top:1px}
  #detail .meta{display:flex;gap:14px;margin-top:11px;font-size:11px;color:var(--ink-3)}
  #detail .meta b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
  #detail .badge{display:inline-flex;align-items:center;gap:5px;margin-top:11px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;background:color-mix(in srgb,var(--bridge) 14%,transparent);border:1px solid color-mix(in srgb,var(--bridge) 30%,transparent);color:var(--ink)}
  #detail .body{padding:13px 16px 15px;overflow-y:auto}
  #detail .lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:8px}
  #detail .chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
  #detail .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);cursor:pointer}
  #detail .chip:hover{color:var(--ink)}
  #detail .chip .d{width:7px;height:7px;border-radius:50%;flex:none}
  #detail .top{font-size:12.5px;line-height:1.5;color:var(--ink);padding:7px 0;border-top:1px solid var(--line);display:flex;gap:9px}
  #detail .top:first-of-type{border-top:0}
  #detail .top .tb{width:3px;border-radius:2px;flex:none;align-self:stretch;min-height:16px}
  #detail .close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);cursor:pointer;font-size:15px;line-height:1;display:grid;place-items:center}
  #detail .close:hover{color:var(--ink)}

  #tip{position:fixed;z-index:9;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--panel);border:1px solid var(--line-2);border-radius:9px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow);max-width:240px}
  #tip.show{opacity:1}
  #tip .r{font-weight:680;font-variant-numeric:tabular-nums}
  #tip .s{color:var(--ink-3);font-size:11px;margin-top:1px}

  #hint{bottom:18px;right:18px;padding:8px 12px;font-size:11px;color:var(--ink-3);display:flex;gap:12px;align-items:center}
  #hint kbd{font-family:var(--f);background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:10.5px;color:var(--ink-2)}
  #themeBtn{position:fixed;z-index:6;bottom:18px;left:286px;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;cursor:pointer}
  #themeBtn svg{width:17px;height:17px;stroke:var(--ink-2);fill:none;stroke-width:1.7}
  #themeBtn:hover svg{stroke:var(--ink)}

  @media (max-width:720px){
    #legend{width:calc(100vw - 36px);max-height:36vh}
    #detail{width:calc(100vw - 36px);top:auto;bottom:18px;right:18px;left:18px;max-height:50vh}
    #head{max-width:calc(100vw - 210px)} #themeBtn{left:auto;right:18px;bottom:66px} #hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){#detail,#tip,.toggle .sw,.toggle .sw::after{transition:none}}
</style>

<canvas id="cv"></canvas>

<div id="head" class="float">
  <h1>Peta Tematik Al-Qur'an</h1>
  <div class="sub">Indeks Tafsiriyah — Ustadz Muhammad Thalib · 3D</div>
  <div class="stats">
    <span><b>13</b> kategori</span><span><b>2.451</b> topik</span>
    <span><b>1.554</b> ayat</span><span><b>494</b> ayat penghubung</span>
  </div>
</div>

<div id="searchWrap" class="float"><input id="search" placeholder="Cari ayat (mis. 2:255) atau surah…" autocomplete="off" spellcheck="false"></div>

<div id="legend" class="float">
  <div class="lh"><span>Kategori</span><button class="reset" id="reset">Tampilkan semua</button></div>
  <div id="cats"></div>
  <div class="foot">
    <label class="toggle on" id="spinToggle"><span class="sw"></span>Putar otomatis</label>
    <label class="toggle" id="bridgeToggle"><span class="sw"></span>Hanya ayat penghubung</label>
  </div>
</div>

<div id="detail" class="float">
  <button class="close" id="dClose" aria-label="Tutup">&times;</button>
  <div class="dh">
    <div class="ref" id="dRef"></div><div class="surah" id="dSurah"></div>
    <div class="meta"><span><b id="dCites"></b> kutipan</span><span><b id="dCats"></b> kategori</span></div>
    <div id="dBadge"></div>
  </div>
  <div class="body">
    <div class="lbl">Muncul di kategori</div><div class="chips" id="dChips"></div>
    <div class="lbl">Topik</div><div id="dTops"></div>
  </div>
</div>

<div id="tip"><div class="r" id="tipR"></div><div class="s" id="tipS"></div></div>
<button id="themeBtn" class="float" aria-label="Ganti tema"><svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
<div id="hint" class="float"><span><kbd>seret</kbd> putar</span><span><kbd>gulir</kbd> zoom</span><span>klik ayat untuk detail</span></div>

  .force("x",d3.forceX(d=>d.kind==="cat"?d.hx:0).strength(d=>d.kind==="cat"?0.5:0.006))
  .force("y",d3.forceY(d=>d.kind==="cat"?d.hy:0).strength(d=>d.kind==="cat"?0.5:0.006))
  .force("z",d3.forceZ(d=>d.kind==="cat"?d.hz:0).strength(d=>d.kind==="cat"?0.5:0.006))
  .velocityDecay(0.44).stop();
for(let i=0;i<200;i++) sim.tick();

// ---- camera ----
let rotX=-0.25, rotY=0.5, scale=1, focal=680, autoRotate=!reduce;
let soloCat=null, bridgeOnly=false, hover=null, selected=null, searchHit=null;
function resize(){ W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cx=W/2;cy=H/2; }
window.addEventListener("resize",()=>{resize();if(reduce)draw();}); resize();
// fit: base scale from graph radius
let gr=0; nodes.forEach(n=>{gr=Math.max(gr,Math.hypot(n.x,n.y,n.z));});
scale=Math.min(W,H)/(gr*2.35);

function catVisible(ci){return soloCat===null||soloCat===ci;}
function verseVisible(v){ if(bridgeOnly&&v.b<2)return false; if(soloCat!==null&&!v.cats.includes(soloCat))return false; return true; }

// project a world point to screen with current camera
function project(n){
  const cyR=Math.cos(rotY),syR=Math.sin(rotY), cxR=Math.cos(rotX),sxR=Math.sin(rotX);
  let x=n.x*cyR - n.z*syR, z=n.x*syR + n.z*cyR, y=n.y;
  let y2=y*cxR - z*sxR, z2=y*sxR + z*cxR;
  const p=focal/(focal + z2);   // nearer (smaller z2) → larger p
  return {X:cx + x*p*scale, Y:cy + y2*p*scale, d:z2, p};
}

let t0=performance.now();
function draw(){
  ctx.save(); ctx.clearRect(0,0,cv.width,cv.height); ctx.scale(DPR,DPR);
  const time=(performance.now()-t0)/1000;
  // project all
  for(const n of nodes){ const pr=project(n); n._X=pr.X; n._Y=pr.Y; n._d=pr.d; n._p=pr.p; }
  // links (draw behind, alpha by depth)
  ctx.lineWidth=0.7;
  for(const l of links){ const s=l.source,t=l.target; if(!verseVisible(t))continue;
    const hot=(hover&&(hover===s||hover===t))||(selected&&(selected===s||selected===t));
    const a=hot?0.55:(soloCat!==null?0.16:0.055)*Math.max(.25,t._p);
    ctx.strokeStyle=hexA(PALETTE[s.ci],a); ctx.beginPath(); ctx.moveTo(s._X,s._Y); ctx.lineTo(t._X,t._Y); ctx.stroke();
  }
  // depth sort: far (large d) first
  const order=nodes.filter(n=>n.kind==="cat"?catVisible(n.ci):verseVisible(n)).sort((a,b)=>b._d-a._d);
  for(const n of order){
    const dc=Math.max(.2,Math.min(1.15,n._p)); // depth cue
    if(n.kind==="verse"){
      const isB=n.b>=2, hot=hover===n||selected===n||searchHit===n;
      const dim=(hover&&hover.kind==="cat"&&!n.cats.includes(hover.ci))?0.22:1;
      const r=Math.max(.6,n.r*n._p*scale*0.9);
      if(isB){ const tw=reduce?1:(0.82+0.18*Math.sin(time*1.5+n.a)); const g=hot?1:(0.45+0.5*(n.b/6))*tw;
        ctx.beginPath();ctx.arc(n._X,n._Y,r*2.6,0,7);ctx.fillStyle=hexA(css('--bridge'),0.09*g*dc*dim);ctx.fill();
        ctx.beginPath();ctx.arc(n._X,n._Y,r,0,7);ctx.fillStyle=hexA(css('--bridge'),Math.min(1,0.68+0.32*g)*dc*dim);ctx.fill();
      } else { const col=PALETTE[n.primary];
        if(hot){ctx.beginPath();ctx.arc(n._X,n._Y,r*2.3,0,7);ctx.fillStyle=hexA(col,0.16*dc);ctx.fill();}
        ctx.beginPath();ctx.arc(n._X,n._Y,r,0,7);ctx.fillStyle=hexA(col,(hot?1:0.62)*dc*dim);ctx.fill();
      }
      if(hot){ctx.lineWidth=1.5;ctx.strokeStyle=hexA(css('--ink'),0.9);ctx.beginPath();ctx.arc(n._X,n._Y,r+3,0,7);ctx.stroke();}
    } else {
      const on=catVisible(n.ci), a=(on?1:0.25)*dc, hot=hover===n||soloCat===n.ci;
      const r=Math.max(5,n.r*n._p*scale);
      ctx.beginPath();ctx.arc(n._X,n._Y,r*1.5,0,7);ctx.fillStyle=hexA(n.col,0.14*a);ctx.fill();
      ctx.beginPath();ctx.arc(n._X,n._Y,r,0,7);ctx.fillStyle=hexA(n.col,(hot?0.95:0.82)*a);ctx.fill();
      ctx.lineWidth=hot?2.2:1.3;ctx.strokeStyle=hexA('#ffffff',0.5*a);ctx.beginPath();ctx.arc(n._X,n._Y,r,0,7);ctx.stroke();
      const fs=Math.max(10,Math.min(15,12*n._p));
      ctx.font=`650 ${fs}px ${getComputedStyle(document.body).fontFamily}`;ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillStyle=hexA(css('--ink'),Math.min(1,a*1.1));ctx.shadowColor="rgba(0,0,0,.9)";ctx.shadowBlur=6;
      ctx.fillText(shortName(n.name),n._X,n._Y+r+fs*0.95);ctx.shadowBlur=0;
    }
  }
  ctx.restore();
}

function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function hexA(hex,a){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');const n=parseInt(hex,16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${Math.max(0,Math.min(1,a))})`;}
function shortName(n){return (n=n.replace(/ dalam Al-Qur’an$/,'').replace(/ Subhanahu.*/,'').replace(/ Shallallahu.*/,' ﷺ')).length>24?n.slice(0,23)+'…':n;}

// ---- render loop ----
let dragging=false;
function frame(){ if(autoRotate&&!dragging&&!document.hidden){ rotY+=0.0018; } draw(); requestAnimationFrame(frame); }
draw(); if(!reduce) requestAnimationFrame(frame);

// ---- picking (screen space, prefer nearer) ----
function nodeAt(px,py){
  let best=null,bs=-1;
  for(const c of catNodes){ if(!catVisible(c.ci))continue; const r=Math.max(6,c.r*c._p*scale); if(Math.hypot(c._X-px,c._Y-py)<r+7 && c._p>bs){bs=c._p;best=c;} }
  if(best) return best;
  for(const v of verseNodes){ if(!verseVisible(v))continue; const r=Math.max(3.5,v.r*v._p*scale); if(Math.hypot(v._X-px,v._Y-py)<r+4 && v._p>bs){bs=v._p;best=v;} }
  return best;
}

// ---- pointer: drag=orbit, click=select ----
let px0=0,py0=0,moved=false,downT=0;
cv.addEventListener("pointerdown",e=>{dragging=true;moved=false;px0=e.clientX;py0=e.clientY;downT=Date.now();cv.setPointerCapture(e.pointerId);cv.classList.add("grabbing");});
cv.addEventListener("pointermove",e=>{
  const r=cv.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;
  if(dragging){ const dx=e.clientX-px0,dy=e.clientY-py0; if(Math.abs(dx)+Math.abs(dy)>3)moved=true;
    rotY+=dx*0.006; rotX+=dy*0.006; rotX=Math.max(-1.45,Math.min(1.45,rotX)); px0=e.clientX;py0=e.clientY; if(reduce)draw();
  } else { const n=nodeAt(mx,my); hover=n;
    if(n){cv.style.cursor="pointer";
      if(n.kind==="verse"){tipR.textContent=n.id+" · "+n.nm;tipS.textContent=n.b>=2?(n.b+" kategori · "+n.c+" kutipan"):(n.c+" kutipan");}
      else{tipR.textContent=n.name.replace(/ dalam Al-Qur’an$/,'');tipS.textContent=n.entries+" topik · "+n.vc+" ayat";}
      tip.classList.add("show");let tx=e.clientX+14,ty=e.clientY+14;if(tx+240>window.innerWidth)tx=e.clientX-252;tip.style.left=tx+"px";tip.style.top=ty+"px";
    } else {cv.style.cursor="grab";tip.classList.remove("show");}
    if(reduce)draw();
  }
});
cv.addEventListener("pointerup",e=>{
  dragging=false;cv.classList.remove("grabbing");
  if(!moved && Date.now()-downT<400){ const r=cv.getBoundingClientRect();const n=nodeAt(e.clientX-r.left,e.clientY-r.top);
    if(n){ if(n.kind==="cat")toggleSolo(n.ci); else openDetail(n); } }
});
cv.addEventListener("pointerleave",()=>{hover=null;tip.classList.remove("show");if(reduce)draw();});
cv.addEventListener("wheel",e=>{e.preventDefault();scale*=Math.exp(-e.deltaY*0.0012);scale=Math.max(0.15,Math.min(6,scale));if(reduce)draw();},{passive:false});

const tip=document.getElementById("tip"),tipR=document.getElementById("tipR"),tipS=document.getElementById("tipS");
const detail=document.getElementById("detail");
function openDetail(v){
  selected=v;searchHit=null;
  document.getElementById("dRef").textContent=v.e>v.a?(v.s+":"+v.a+"–"+v.e):v.id;
  document.getElementById("dSurah").textContent="QS. "+v.nm;
  document.getElementById("dCites").textContent=v.c;document.getElementById("dCats").textContent=v.b;
  document.getElementById("dBadge").innerHTML=v.b>=2?'<span class="badge">✦ Ayat penghubung — '+v.b+' kategori</span>':'';
  const chips=document.getElementById("dChips");chips.innerHTML="";
  v.cats.forEach(ci=>{const c=catById.get(ci);const el=document.createElement("div");el.className="chip";el.innerHTML='<span class="d" style="background:'+PALETTE[ci]+'"></span>'+shortName(c.name);el.onclick=()=>toggleSolo(ci);chips.appendChild(el);});
  const tops=document.getElementById("dTops");tops.innerHTML="";
  v.tops.forEach(t=>{const el=document.createElement("div");el.className="top";el.innerHTML='<span class="tb" style="background:'+PALETTE[t.ci]+'"></span><span>'+esc(t.t)+'</span>';tops.appendChild(el);});
  detail.classList.add("show");if(reduce)draw();
}
document.getElementById("dClose").onclick=()=>{detail.classList.remove("show");selected=null;if(reduce)draw();};

const catsEl=document.getElementById("cats");
DATA.categories.forEach(c=>{const el=document.createElement("div");el.className="cat";el.dataset.ci=c.i;
  el.innerHTML='<span class="dot" style="color:'+PALETTE[c.i]+';background:'+PALETTE[c.i]+'"></span><span class="nm">'+esc(c.name.replace(/ dalam Al-Qur’an$/,'').replace(/ Subhanahu.*/,'').replace(/ Shallallahu.*/,' ﷺ'))+'</span><span class="ct">'+c.entries+'</span>';
  el.onclick=()=>toggleSolo(c.i);catsEl.appendChild(el);});
function toggleSolo(ci){ soloCat=(soloCat===ci)?null:ci;
  [...catsEl.children].forEach(el=>{const i=+el.dataset.ci;el.classList.toggle("solo",soloCat===i);el.classList.toggle("off",soloCat!==null&&soloCat!==i);});
  if(reduce)draw();
}
document.getElementById("reset").onclick=()=>{soloCat=null;[...catsEl.children].forEach(el=>el.classList.remove("solo","off"));if(reduce)draw();};
const bt=document.getElementById("bridgeToggle");bt.onclick=()=>{bridgeOnly=!bridgeOnly;bt.classList.toggle("on",bridgeOnly);if(reduce)draw();};
const st=document.getElementById("spinToggle");st.onclick=()=>{autoRotate=!autoRotate;st.classList.toggle("on",autoRotate);};

const search=document.getElementById("search"),sw=document.getElementById("searchWrap");
search.addEventListener("input",()=>{const q=search.value.trim().toLowerCase();searchHit=null;
  if(!q){sw.classList.remove("hit");if(reduce)draw();return;}
  let hit=verseNodes.find(v=>v.id===q)||verseNodes.find(v=>v.id.replace(/\s/g,'')===q.replace(/\s/g,''));
  if(!hit)hit=verseNodes.filter(v=>v.nm.toLowerCase().includes(q)).sort((a,b)=>b.c-a.c)[0];
  sw.classList.toggle("hit",!!hit);
  if(hit){searchHit=hit;autoRotate=false;st.classList.remove("on");
    // rotate camera so the hit faces front: solve angles from its world pos
    rotY=Math.atan2(hit.x,hit.z); rotX=Math.max(-1.2,Math.min(1.2,-Math.atan2(hit.y,Math.hypot(hit.x,hit.z))));
    openDetail(hit);}
  if(reduce)draw();
});
search.addEventListener("keydown",e=>{if(e.key==="Escape"){search.value="";search.dispatchEvent(new Event("input"));search.blur();}});

document.getElementById("themeBtn").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme");const next=cur==="light"?"dark":(cur==="dark"?"light":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark"));document.documentElement.setAttribute("data-theme",next);if(reduce)draw();};
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
</script>
